[package]
name = "context-namespace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Hierarchical, path-addressable context compaction for LLM agents"
categories = ["data-structures", "text-processing"]
keywords = ["llm", "agent", "context", "memory"]

[features]
default = ["json-schema", "async-adapters"]
json-schema = ["dep:schemars"]
async-adapters = ["dep:async-trait"]
semantic-search = ["dep:ndarray"]
tracing = ["dep:tracing"]

[dependencies]
async-trait = { workspace = true, optional = true }
hex.workspace = true
indexmap.workspace = true
ndarray = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
slotmap.workspace = true
thiserror.workspace = true
time.workspace = true
tracing = { workspace = true, optional = true }
unicode-normalization.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion = "0.7"
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[bench]]
name = "namespace_operations"
harness = false
