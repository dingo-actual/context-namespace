[workspace]
resolver = "3"
members = [
    "crates/context-namespace",
    "crates/context-namespace-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/dingo-actual/context-namespace"
documentation = "https://docs.rs/context-namespace"

[workspace.dependencies]
async-trait = "0.1"
hex = "0.4"
indexmap = { version = "2.14", features = ["serde"] }
ndarray = { version = "0.17", features = ["serde"] }
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }
pythonize = "=0.29.0"
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.11.0"
slotmap = "1.1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
