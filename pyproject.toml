[project]
name = "context-namespace"
description = "Hierarchical, path-addressable context compaction for LLM agents"
dynamic = ["version"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["llm", "agent", "context", "memory"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/dingo-actual/context-namespace"
Issues = "https://github.com/dingo-actual/context-namespace/issues"

[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/context-namespace-py/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "context_namespace._native"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pyright]
extraPaths = ["python"]
reportMissingModuleSource = "none"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "hypothesis>=6.165.10,<7.0"
]

lint = [
    "ruff>=0.16.4,<1.0",
]

typecheck = [
    "pyright>=1.1.411,<2.0",
    "mypy>=2.3.1,<3.0",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]
